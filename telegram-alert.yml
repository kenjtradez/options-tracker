name: Telegram Market Alert

on:
  schedule:
    # Every 3 hours, 07:00-19:00 UTC, Monday-Friday (covers London open through NY close).
    # GitHub cron is UTC and does not adjust for BST/daylight saving.
    - cron: '0 7,10,13,16,19 * * 1-5'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run alert script
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alert.py
